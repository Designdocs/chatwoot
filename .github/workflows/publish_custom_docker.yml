name: Publish custom Chatwoot docker image

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: git tag or latest)"
        required: false

env:
  REGISTRY: ${{ vars.REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'smusiczz' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'chatwoot' }}
  PLATFORM: ${{ vars.PLATFORM || 'linux/amd64' }}
  DOCKERFILE: ${{ vars.DOCKERFILE || 'docker/Dockerfile' }}
  BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          if [ -n "${{ github.ref }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          elif [ -n "${{ vars.IMAGE_TAG }}" ]; then
            echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
